# Consulta o Supabase 2 vezes por semana para ele não pausar por inatividade.
# Usa só a chave pública (a mesma que já está no index.html), então não precisa de segredos.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 * * 1,4"   # segundas e quintas, 12:00 UTC
  workflow_dispatch:          # permite rodar manualmente na aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://gpznzigdgunfyoagkkmt.supabase.co/rest/v1/app_state?select=id&limit=1" \
            -H "apikey: sb_publishable_567ShIRpY-VpadBXjQFo-Q_LDRAI1VU"
          echo
          echo "Supabase respondeu normalmente."
